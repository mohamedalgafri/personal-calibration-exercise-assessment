<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Inter, Helvetica, Arial, sans-serif"><title>PSO identity check</title><rect width="560" height="300" fill="#ffffff"/><text x="280.0" y="24.0" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">In this test, PSO picked up person identity when its fitness ignored persons</text><line x1="60" x2="540" y1="230.0" y2="230.0" stroke="#1f2937"/><text x="52.0" y="234.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">0%</text><line x1="60" x2="540" y1="185.0" y2="185.0" stroke="#e5e7eb"/><text x="52.0" y="189.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">20%</text><line x1="60" x2="540" y1="140.0" y2="140.0" stroke="#e5e7eb"/><text x="52.0" y="144.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">40%</text><line x1="60" x2="540" y1="95.0" y2="95.0" stroke="#e5e7eb"/><text x="52.0" y="99.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">60%</text><line x1="60" x2="540" y1="50.0" y2="50.0" stroke="#e5e7eb"/><text x="52.0" y="54.0" font-size="11" text-anchor="end" fill="#6b7280" font-weight="normal">80%</text><rect x="100" y="58.8" width="60" height="171.2" fill="#dc2626" rx="3"/><text x="130.0" y="52.8" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">76%</text><text x="130.0" y="246.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">PSO</text><rect x="175" y="175.8" width="60" height="54.2" fill="#6b7280" rx="3"/><text x="205.0" y="169.8" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">24%</text><text x="205.0" y="246.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">random lists</text><text x="167.0" y="264.0" font-size="11.5" text-anchor="middle" fill="#1f2937" font-weight="normal">record-wise fitness</text><rect x="340" y="171.3" width="60" height="58.7" fill="#2563eb"