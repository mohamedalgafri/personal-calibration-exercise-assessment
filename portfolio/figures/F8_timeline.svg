<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Inter, Helvetica, Arial, sans-serif"><title>24-month plan</title><rect width="820" height="330" fill="#ffffff"/><text x="410.0" y="24.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">Illustrative 24-month plan (to be agreed with the advisor)</text><line x1="360.0" x2="360.0" y1="50" y2="290" stroke="#e5e7eb"/><text x="360.0" y="306.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">month 1</text><line x1="451.7" x2="451.7" y1="50" y2="290" stroke="#e5e7eb"/><text x="451.7" y="306.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">month 6</text><line x1="561.7" x2="561.7" y1="50" y2="290" stroke="#e5e7eb"/><text x="561.7" y="306.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">month 12</text><line x1="671.7" x2="671.7" y1="50" y2="290" stroke="#e5e7eb"/><text x="671.7" y="306.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">month 18</text><line x1="781.7" x2="781.7" y1="50" y2="290" stroke="#e5e7eb"/><text x="781.7" y="306.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">month 24</text><text x="350.0" y="67.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Courses, Portuguese, re-running the preparatory analyses</text><rect x="360.0" y="55" width="110.0" height="18" rx="4" fill="#6b7280" fill-opacity="0.85"/><text x="350.0" y="97.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Literature map; qualification plan for the stronger model</text><rect x="360.0" y="85" width="110.0" height="18" rx="4" fill="#2563eb" fill-opacity="0.85"/><text x="350.0" y="127.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Open evaluation package; stability audit; dashboard skeleton</text><rect x="451.7" y="115" width="128.3" height="18" rx="4" fill="#2563eb" fill-opacity="0.85"/><text x="350.0" y="157.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Frozen protocol; search for multi-session data</text><rect x="506.7" y="145" width="73.3" height="18" rx="4" fill="#f59e0b" fill-opacity="0.85"/><text x="350.0" y="187.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Qualifying exam; confirmatory analysis on an unopened dataset</text><rect x="561.7" y="175" width="73.3" height="18" rx="4" fill="#dc2626" fill-opacity="0.85"/><text x="350.0" y="217.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Person-level analysis; manuscript; dashboard</text><rect x="616.7" y="205" width="110.0" height="18" rx="4" fill="#2563eb" fill-opacity="0.85"/><text x="350.0" y="247.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Extensions if agreed (video, adapt-or-not, quantification)</text><rect x="616.7" y="235" width="110.0" height="18" rx="4" fill="#10b981" fill-opacity="0.85"/><text x="350.0" y="277.0" font-size="11.5" text-anchor="end" fill="#1f2937" font-weight="normal">Dissertation, defence, public release</text><rect x="708.3" y="265" width="91.7" height="18" rx="4" fill="#1f2937" fill-opacity="0.85"/></svg>