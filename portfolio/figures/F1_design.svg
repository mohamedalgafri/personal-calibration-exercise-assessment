<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" width="820" height="345" font-family="Inter, Helvetica, Arial, sans-serif"><title>Study design</title><rect width="820" height="345" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="410.0" y="24.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">How one new person is evaluated (every strategy sees the same evaluation data)</text><rect x="20" y="60" width="170" height="60" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="105.0" y="85.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Other persons</text><text x="105.0" y="102.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">train the general model</text><rect x="20" y="200" width="170" height="60" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="105.0" y="225.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">The new person</text><text x="105.0" y="242.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">never seen in training</text><rect x="240" y="200" width="150" height="28" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="315.0" y="214.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">calibration examples</text><rect x="240" y="236" width="150" height="28" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="315.0" y="250.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">evaluation examples</text><line x1="190" y1="230" x2="238" y2="214" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="190" y1="230" x2="238" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="50" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="545.0" y="63.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">General model</text><text x="545.0" y="80.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">no personal data</text><line x1="190" y1="90" x2="448" y2="68" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="92" width="190" height="36" rx="8" fill="#f9fafb" stroke="#10b981" stroke-width="1.5"/><text x="545.0" y="105.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Label-free adjustment</text><text x="545.0" y="122.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">calibration data, no labels</text><line x1="390" y1="214" x2="448" y2="110" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="134" width="190" height="36" rx="8" fill="#f9fafb" stroke="#2563eb" stroke-width="1.5"/><text x="545.0" y="147.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Adapted (own labels)</text><text x="545.0" y="164.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">calibration data + labels</text><line x1="390" y1="214" x2="448" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="176" width="190" height="36" rx="8" fill="#f9fafb" stroke="#f59e0b" stroke-width="1.5"/><text x="545.0" y="189.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Another person's examples</text><text x="545.0" y="206.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">same number, unseen donor</text><line x1="190" y1="90" x2="448" y2="194" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="218" width="190" height="36" rx="8" fill="#f9fafb" stroke="#f59e0b" stroke-width="1.5"/><text x="545.0" y="231.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Replay control</text><text x="545.0" y="248.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">same number, already seen</text><line x1="190" y1="90" x2="448" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="450" y="260" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="545.0" y="273.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Personal-only model</text><text x="545.0" y="290.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">own labels only</text><line x1="390" y1="214" x2="448" y2="278" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><rect x="680" y="110" width="130" height="130" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/><text x="745.0" y="130.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Per person</text><text x="745.0" y="152.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">balanced accuracy</text><text x="745.0" y="169.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">missed deviations</text><text x="745.0" y="186.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">false alarms</text><text x="745.0" y="203.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">better or worse?</text><text x="745.0" y="220.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">stable over splits?</text><line x1="640" y1="68" x2="678" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="110" x2="678" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="152" x2="678" y2="162" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="194" x2="678" y2="184" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="236" x2="678" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="278" x2="678" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/><path d="M390,250 L420,250 L420,300 L745,300 L745,242" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="560.0" y="295.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">same held-out evaluation examples for every strategy</text><text x="410.0" y="337.0" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="normal">Planned master's design; a qualified stronger general model and bias-only recalibration are added to the comparison.</text></svg>