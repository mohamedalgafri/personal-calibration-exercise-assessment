<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose image diagnostic</title>
<style>
  :root { --bg: #ffffff; --fg: #1b1b1b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161616; --fg: #ececec; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Single-frame pose diagnostic</h1>
<pre id="log">running…</pre>
<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const log = (s) => { document.getElementById("log").textContent += "\n" + s; };
const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const load = (src) => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const out = {};
for (const model of ["lite", "full"]) {
  const lm = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${model}/float16/1/pose_landmarker_${model}.task`, delegate: "CPU" },
    runningMode: "IMAGE", numPoses: 2, minPoseDetectionConfidence: 0.3,
  });
  for (const f of ["f10.png", "f10_bright.png"]) {
    const im = await load(`../smoke/diag/${f}`);
    const res = lm.detect(im);
    const n = res.landmarks ? res.landmarks.length : 0;
    const vis = n ? res.landmarks.map(p => [11,12,13,14,15,16].map(i => (p[i].visibility ?? 0).toFixed(2)).join(",")) : [];
    out[`${model}/${f}`] = { poses: n, arm_visibility: vis };
    log(`${model} ${f}: poses ${n} ${vis.join(" | ")}`);
  }
}
await fetch("/save/diag_image_cam17.json", { method: "POST", body: JSON.stringify(out) });
document.title = "DONE diag";
</script>
</body>
</html>
