<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose smoke test</title>
<style>
  :root { --bg: #ffffff; --fg: #1b1b1b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161616; --fg: #ececec; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  video { max-width: 240px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>MediaPipe pose smoke test (camera feasibility)</h1>
<p>Video: <code id="src"></code> · model: <code id="model"></code></p>
<video id="v" muted playsinline crossorigin="anonymous"></video>
<pre id="log">loading…</pre>
<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const q = new URLSearchParams(location.search);
const SRC = q.get("video") || "../smoke/PM_000-Camera18-30fps-transposed.mp4";
const MODEL = q.get("model") || "lite";
const OUT = q.get("out") || "smoke_pose_lite.json";
const FPS = 30;
document.getElementById("src").textContent = SRC;
document.getElementById("model").textContent = MODEL;
const log = (s) => { document.getElementById("log").textContent += "\n" + s; };
const v = document.getElementById("v");
v.src = SRC;
await new Promise(r => v.addEventListener("loadedmetadata", r, { once: true }));
const N = Math.round(v.duration * FPS);
log(`video ${v.videoWidth}x${v.videoHeight}, duration ${v.duration.toFixed(2)} s, frames ≈ ${N}`);
const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const lm = await PoseLandmarker.createFromOptions(fileset, {
  baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${MODEL}/float16/1/pose_landmarker_${MODEL}.task`, delegate: "CPU" },
  runningMode: "VIDEO", numPoses: 1,
});
log("model loaded; extracting every frame by seeking");
const frames = [];
const t0 = performance.now();
const seekTo = (t) => new Promise(r => {
  let done = false; const fin = () => { if (!done) { done = true; r(); } };
  v.addEventListener("seeked", fin, { once: true });
  v.currentTime = t;
  setTimeout(fin, 1500);  // fallback if 'seeked' never fires (seen on the first frame)
});
await v.play().catch(() => {}); v.pause();  // make sure frames are decodable
let stalls = 0;
for (let i = 0; i < N; i++) {
  const before = performance.now();
  await seekTo((i + 0.5) / FPS);
  if (performance.now() - before > 1400) stalls++;
  const res = lm.detectForVideo(v, Math.round(i * 1000 / FPS) + 1);
  const p = res.landmarks && res.landmarks[0];
  frames.push(p ? p.map(k => [k.x * v.videoWidth, k.y * v.videoHeight, k.visibility ?? 0]) : null);
  if (i % 100 === 0) log(`frame ${i}/${N}, ${(i / ((performance.now() - t0) / 1000)).toFixed(1)} fps, seek stalls ${stalls}, frames with a pose so far ${frames.filter(f => f).length}`);
}
const secs = (performance.now() - t0) / 1000;
const out = { video: SRC, model: MODEL, version: "tasks-vision@0.10.14", width: v.videoWidth, height: v.videoHeight,
              n_frames: N, seconds: secs, fps_processing: N / secs, seek_stalls: stalls, frames };
const r = await fetch(`/save/${OUT}`, { method: "POST", body: JSON.stringify(out) });
log(`done: ${N} frames in ${secs.toFixed(1)} s = ${(N / secs).toFixed(1)} fps; saved: ${await r.text()}`);
document.title = "DONE pose smoke";
</script>
</body>
</html>
